<!-- Header -->
  <header class="py-4 px-6 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-xs transition-colors duration-200">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="font-bold text-xl text-indigo-600 dark:text-indigo-400">
        {{ site.Title }}
      </div>


            <!-- Tombol Switch Dark Mode (Dipindah ke sini) -->
            <div x-data class="flex-shrink-0">
                <button @click="$store.theme.toggle()" class="w-10 h-10 bg-white dark:bg-gray-800 text-gray-800 dark:text-yellow-300 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 flex items-center justify-center hover:bg-gray-50 dark:hover:bg-gray-700 transition-all duration-300 focus:outline-none" aria-label="Toggle theme">
                    <span class="flex" x-show="!$store.theme.isDark">
                        <span class="icon-[lucide--moon] w-5 h-5 text-gray-600"></span>
                    </span>
                    <span class="flex" x-show="$store.theme.isDark" style="display: none;">
                        <span class="icon-[lucide--sun] w-5 h-5 text-yellow-400"></span>
                    </span>
                </button>
            </div>

    </div>
  </header>
